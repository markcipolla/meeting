name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      # Check out main, not the tag: the formula bump is committed back to main.
      # (The tag is expected to point at main's head.)
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and test
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh
          ./build/Meetings.app/Contents/MacOS/Meetings --selftest

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes

      # Homebrew builds from the source tarball, so there is nothing to notarize
      # and nothing to strip quarantine from. Only the URL and digest change.
      - name: Point the formula at this tag
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d" " -f1)
          sed -i "" -e "s|^  url .*|  url \"${url}\"|" \
                    -e "s|^  sha256 .*|  sha256 \"${sha}\"|" Formula/meetings.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "meetings ${GITHUB_REF_NAME}" Formula/meetings.rb
          git push origin HEAD:main
